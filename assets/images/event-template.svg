<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!--
    Template sampul event.

    Dirancang untuk DUA bingkai sekaligus: kartu daftar event yang memotongnya jadi
    kira-kira 2,1:1 (372x176 — kecil, dan bagian atas-bawah terbuang), dan kepala
    halaman detail yang memakainya penuh 16:9.

    Karena itu seluruh isi yang harus terbaca duduk di PITA TENGAH setinggi 900px
    dikurangi ~110px di atas dan bawah. Versi pertama menaruh lambang di pojok
    kiri-atas dan ranting di kanan-atas; pada kartu keduanya terpotong, dan yang
    tersisa di tengah cuma bidang pucat yang terbaca sebagai gambar gagal muat.

    Bentuknya juga dibuat lebih tegas: pada lebar 372px, blur tebal berubah jadi
    bubur. Yang dipakai sekarang lengkung rapi berisi warna datar, dengan blur
    hanya sebagai lapis kedalaman di belakangnya.
  -->
  <defs>
    <linearGradient id="langit" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FCF8F2"/>
      <stop offset="0.62" stop-color="#F6EFE4"/>
      <stop offset="1" stop-color="#EFE5D6"/>
    </linearGradient>

    <linearGradient id="bukit1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9D6C2"/>
      <stop offset="1" stop-color="#AFC3A9"/>
    </linearGradient>
    <linearGradient id="bukit2" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#8FA98A"/>
      <stop offset="1" stop-color="#7B9576"/>
    </linearGradient>
    <linearGradient id="bukit3" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#46603F"/>
      <stop offset="1" stop-color="#2F4A2C"/>
    </linearGradient>
    <linearGradient id="pasir" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8CFA9"/>
      <stop offset="1" stop-color="#D3B489"/>
    </linearGradient>

    <radialGradient id="mentari" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EFDDB4" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#EBD8B4" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#EBD8B4" stop-opacity="0"/>
    </radialGradient>

    <filter id="halus" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#langit)"/>

  <!-- Matahari rendah: jangkar tenang di sepertiga kanan, tetap utuh saat dipotong -->
  <circle cx="1128" cy="418" r="330" fill="url(#mentari)"/>
  <circle cx="1128" cy="418" r="96" fill="#EBD6A8" opacity="0.30" filter="url(#halus)"/>
  <circle cx="1128" cy="418" r="70" fill="#E9D3A4" opacity="0.26"/>

  <!-- Kedalaman di belakang bukit, satu-satunya yang diburamkan -->
  <ellipse cx="420" cy="560" rx="520" ry="180" fill="#DCE4D3" opacity="0.55" filter="url(#halus)"/>

  <!-- Tiga lapis bukit. Puncaknya sengaja di antara y=430 dan y=620 supaya tetap
       tergambar utuh pada potongan kartu yang membuang atas dan bawah. -->
  <path d="M0 640 C 190 528, 366 512, 530 566 C 690 618, 800 596, 944 540
           C 1108 476, 1290 470, 1430 522 C 1512 552, 1560 574, 1600 588 L 1600 900 L 0 900 Z"
        fill="url(#bukit1)"/>
  <path d="M0 716 C 168 632, 340 620, 496 664 C 660 710, 792 690, 940 638
           C 1116 576, 1300 588, 1430 640 C 1510 672, 1556 692, 1600 706 L 1600 900 L 0 900 Z"
        fill="url(#bukit2)"/>
  <path d="M0 806 C 150 748, 322 744, 470 776 C 640 812, 800 800, 962 764
           C 1140 724, 1320 730, 1450 766 C 1520 786, 1564 800, 1600 810 L 1600 900 L 0 900 Z"
        fill="url(#bukit3)"/>

  <!-- Guratan pasir hangat di kaki bukit terdepan -->
  <path d="M0 862 C 180 834, 384 838, 556 858 C 728 878, 900 872, 1064 856
           C 1240 838, 1420 842, 1600 862 L 1600 900 L 0 900 Z"
        fill="url(#pasir)" opacity="0.5"/>

  <!-- Ranting kiri: menjorok ke tengah, jadi ujungnya tetap terlihat di kartu -->
  <g opacity="0.88">
    <path d="M-20 196 C 128 214, 268 288, 372 404" fill="none" stroke="#5E7758" stroke-width="6" stroke-linecap="round"/>
    <g fill="#6B8564">
      <ellipse cx="58" cy="176" rx="54" ry="21" transform="rotate(-16 58 176)"/>
      <ellipse cx="64" cy="250" rx="50" ry="20" transform="rotate(26 64 250)"/>
      <ellipse cx="160" cy="212" rx="52" ry="20.5" transform="rotate(-8 160 212)"/>
      <ellipse cx="168" cy="290" rx="48" ry="19" transform="rotate(34 168 290)"/>
      <ellipse cx="256" cy="272" rx="47" ry="18.5" transform="rotate(2 256 272)"/>
      <ellipse cx="266" cy="348" rx="45" ry="18" transform="rotate(42 266 348)"/>
      <ellipse cx="340" cy="352" rx="40" ry="16" transform="rotate(16 340 352)"/>
    </g>
    <circle cx="118" cy="228" r="12" fill="#A7BA9E"/>
    <circle cx="222" cy="304" r="10" fill="#A7BA9E"/>
    <circle cx="312" cy="386" r="8.5" fill="#A7BA9E"/>
  </g>
</svg>
